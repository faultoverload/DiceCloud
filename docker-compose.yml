version: '3.7'
services:
  dicecloud-db:
    container_name: dicecloud-db
    image: mongo:latest
    command:
      - --storageEngine=wiredTiger
    volumes:
      - ./dicecloud/data/db:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=meteor
      - MONGO_INITDB_ROOT_PASSWORD=meteor
  dicecloud:
    container_name: dicecloud
    build:
      context: ./
    environment:
    #update ROOT_URL, PORT, and MAIL_URL for your environment
      - ROOT_URL=http://localhost:3000
      - MONGO_URL=mongodb://meteor:meteor@dicecloud-db:27017
      - PORT=3000
      - NODE_ENV=production
      - METEOR_SETTINGS={"public":{"environment":"production","disablePatreon":true}}
      - MAIL_URL=smtp://EMAIL:PASSWORD@SERVER:PORT
    ports:
      - '3000:3000' #The internal port should match the port set in the environmental variables
    volumes:
      #Images that users upload and archived characters are files, not database records.
      #Without these they are lost whenever the container is replaced.
      #Named volumes rather than folders: the app runs as a non-root user and cannot
      #write to a folder that Docker creates.
      - user-images:/app/programs/server/assets/app/userImages
      - archived-characters:/app/programs/server/assets/app/archiveCreatures

volumes:
  user-images:
  archived-characters:
