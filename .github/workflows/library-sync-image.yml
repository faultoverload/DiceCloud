name: Library sync image

# Builds the library sync sidecar (docker/library-sync), runs its unit tests and its
# end-to-end test against the built image, and pushes the image to GitHub Container
# Registry only if both pass.

on:
  push:
    branches: ['**']
    paths:
      - 'docker/library-sync/**'
      - '.github/workflows/library-sync-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: library-sync-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/faultoverload/dicecloud-library-sync

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docker/library-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker/library-sync
          load: true
          tags: dicecloud-library-sync:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=library-sync
          cache-to: type=gha,mode=max,scope=library-sync

      - name: End-to-end test
        run: test/run.sh dicecloud-library-sync:ci

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag dicecloud-library-sync:ci "$tag"
            docker push "$tag"
          done
          {
            echo "### Pushed"
            for tag in $TAGS; do echo "- \`$tag\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
